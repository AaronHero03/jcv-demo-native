name: Seguridad de la app
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-and-sbom:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: npx --no-install expo lint
      - run: npm test -- --ci
      - run: node --test tests/nico-database.test.mjs
      - run: node evals/ask-edge.test.js
      - run: node evals/oracles.test.js
      - name: Generar inventario CycloneDX
        run: |
          mkdir -p artifacts
          npx --no-install cyclonedx-npm --package-lock-only --output-format JSON --output-file artifacts/sbom.cdx.json
      - name: Auditar dependencias
        run: npm audit --audit-level=high --json > artifacts/npm-audit.json
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguridad-nico
          path: artifacts/

  pagos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/create-checkout-session/index.ts supabase/functions/stripe-webhook/index.ts
      - run: deno test --allow-env --config supabase/functions/deno.json supabase/functions/payments_test.ts
